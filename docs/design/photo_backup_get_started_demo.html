<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Backup Organizer — Get Started</title>
<style>
:root { color-scheme: dark; --blue:#35c8ff; --purple:#7866ff; }
* { box-sizing:border-box }
body {
  margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color:#f7faff; background:radial-gradient(ellipse at 50% 42%, #123d75 0%, #0b1c37 43%, #071020 78%);
}
.glow { position:fixed; width:460px;height:460px;border-radius:50%;background:#167bff20;filter:blur(70px);top:17%;left:calc(50% - 230px);pointer-events:none }
main { width:min(92vw,650px); text-align:center; padding:35px 20px 42px; position:relative; z-index:1; }
.brand { display:flex; justify-content:center; align-items:center; gap:11px; font-weight:750; letter-spacing:-.5px; font-size:clamp(17px,3vw,22px); }
.brand-icon { width:34px;height:34px;border:2px solid var(--blue);border-radius:10px;display:grid;place-items:center;color:var(--blue); }
.camera-scene { height:clamp(250px,42vh,360px); display:grid;place-items:center;position:relative;margin:12px auto 6px; }
.camera { width:clamp(250px,54vw,350px); position:relative; animation:float 4s ease-in-out infinite; filter:drop-shadow(0 25px 25px #0008); }
.bodycam { position:relative;height:190px;border-radius:38px 38px 30px 30px;background:linear-gradient(145deg,#627ca6,#202d49 45%,#101a30 80%);border:2px solid #839bc8;box-shadow:inset 0 4px 8px #d7e7ff70,inset 0 -9px 16px #0009; }
.bodycam:before { content:"";position:absolute;top:-35px;left:31%;width:39%;height:48px;border-radius:19px 19px 4px 4px;background:linear-gradient(145deg,#718bb8,#263653);border:2px solid #8fa8d6;border-bottom:0; }
.flash { position:absolute;right:20%;top:35px;width:15px;height:15px;border-radius:50%;background:#eafaff;box-shadow:0 0 16px #5deaff; }
.shutter { position:absolute;top:-11px;left:18%;width:24%;height:18px;border-radius:8px;background:linear-gradient(#31405b,#111827);border:2px solid #7385a8; }
.lens { position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:158px;height:158px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#0c1429,#4c6288 45%,#111a2d 70%);border:7px solid #9bb6e6;box-shadow:0 0 0 7px #263957, inset 0 0 0 3px #0b1324; }
.lens:before { content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid #3f9dff;box-shadow:0 0 22px #2caeff80; }
.glass { width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#b5f5ff 0 5%,#39caff 13%,#1566c7 32%,#222b9d 56%,#090e26 76%);border:4px solid #537fd1;box-shadow:inset -10px -12px 24px #0008,0 0 20px #278cff70;animation:pulse 3s ease-in-out infinite; }
.glass:after { content:"";display:block;width:28px;height:15px;background:#e8ffff;border-radius:50%;transform:rotate(-35deg);margin:20px 0 0 17px;filter:blur(1px);opacity:.9; }
.photo { position:absolute;width:76px;height:60px;border:5px solid #f4f8ff;border-radius:9px;background:linear-gradient(#6de0ff 0 52%,#54bd9b 52%);box-shadow:0 8px 20px #0005; }
.photo:before { content:"";position:absolute;left:5px;bottom:0;border-left:23px solid transparent;border-right:23px solid transparent;border-bottom:26px solid #2992c6; }
.photo:after { content:"";position:absolute;right:7px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff3a7; }
.p1 { top:16%;left:8%;transform:rotate(-13deg);animation:orbitA 5s ease-in-out infinite; }
.p2 { bottom:12%;right:5%;transform:rotate(12deg);background:linear-gradient(#e4a8ff 0 52%,#6f83e9 52%);animation:orbitB 5.5s ease-in-out infinite; }
.p3 { top:20%;right:8%;transform:rotate(10deg) scale(.72);animation:orbitB 6s ease-in-out infinite reverse; }
h1 { font-size:clamp(28px,5vw,42px);line-height:1.12;letter-spacing:-1.4px;margin:14px 0 12px; }
p { color:#b8c9e3;font-size:clamp(15px,2.4vw,18px);line-height:1.65;max-width:450px;margin:0 auto 26px; }
button { cursor:pointer;border:0;border-radius:999px;padding:17px 34px;min-width:min(300px,85vw);font-size:18px;font-weight:750;color:#06213a;background:linear-gradient(100deg,#46d9ff,#299cff);box-shadow:0 10px 32px #168eff4a;transition:transform .2s,box-shadow .2s; }
button:hover { transform:translateY(-3px);box-shadow:0 14px 38px #168eff70; }
button:active { transform:scale(.98); }
.arrow { display:inline-block;margin-left:10px;transition:transform .2s; } button:hover .arrow { transform:translateX(5px); }
#notice { display:none;margin:20px auto 0;padding:15px 18px;max-width:390px;border:1px solid #4ccaff70;border-radius:16px;background:#102b4b;color:#e8f8ff; }
#notice.show { display:block;animation:appear .35s ease-out; }
@keyframes float {0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes pulse {0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
@keyframes orbitA {0%,100%{translate:0 0}50%{translate:-5px -12px}}
@keyframes orbitB {0%,100%{translate:0 0}50%{translate:7px 10px}}
@keyframes appear {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-height:700px){main{padding-top:18px}.camera-scene{height:245px}.bodycam{height:155px}.lens{width:130px;height:130px}.glass{width:85px;height:85px}p{margin-bottom:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="brand"><span class="brand-icon">▧</span><span>Photo Backup Organizer</span></div>
  <section class="camera-scene" aria-label="Animated camera illustration">
    <div class="photo p1"></div><div class="photo p2"></div><div class="photo p3"></div>
    <div class="camera">
      <div class="shutter"></div>
      <div class="bodycam"><div class="flash"></div><div class="lens"><div class="glass"></div></div></div>
    </div>
  </section>
  <h1>Your Memories,<br>Safe and Organized</h1>
  <p>Back up your favorite photos and keep every memory in one place.</p>
  <button id="start">Get Started <span class="arrow">→</span></button>
  <div id="notice" role="status">✨ Welcome! Your next step would open the sign-in or registration screen.</div>
</main>
<script>
document.getElementById('start').addEventListener('click', () => {
  const notice = document.getElementById('notice');
  notice.classList.toggle('show');
  document.getElementById('start').innerHTML = notice.classList.contains('show')
    ? 'Ready to Begin <span class="arrow">✓</span>'
    : 'Get Started <span class="arrow">→</span>';
});
</script>
</body>
</html>
