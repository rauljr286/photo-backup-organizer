<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>You're offline - Photo Backup</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f3f2ee;
            --ink: #1c1b18;
            --muted: #6b7280;
            --primary: #0f766e;
            --surface: #fcfbf7;
            --border: #e4e2da;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1020;
                --ink: #e8ecf6;
                --muted: #94a3b8;
                --primary: #5eead4;
                --surface: #141b30;
                --border: #27324a;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 24rem;
            width: 100%;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
        }
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            border-radius: 50%;
            background: var(--border);
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.3rem; }
        p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.6; }
        a {
            display: inline-block;
            min-height: 46px;
            padding: 0.7rem 1.4rem;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        </span>
        <h1>You're offline</h1>
        <p>This page needs a connection. Your photos stay safely on the server &mdash; reconnect and try again.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
